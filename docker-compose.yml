services:

  webapp:
    image: faqcluster-webapp:local
    ports:
      - "8030:8030"        # Only this port is exposed to the outside world
    environment:
      - PIPELINE_API_URL=http://pipeline:7000
      - POP_WORK_DIR=/app/POP_Work
    volumes:
      - app-data:/app/app-data
      - outputs:/app/outputs
      - pop-work:/app/POP_Work
    depends_on:
      pipeline:
        condition: service_healthy
    restart: unless-stopped

  pipeline:
    image: faqcluster-pipeline:local
    expose:
      - "7000"             # Internal only — not reachable from outside the VM
    environment:
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - app-data:/app/app-data
      - outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  app-data:
  outputs:
  pop-work:
