name: Build & Push Pipeline Image

on:
  push:
    branches: [main, server]
    paths:
      - "pipeline_server/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push pipeline image
        uses: docker/build-push-action@v5
        with:
          context: ./pipeline_server
          file: pipeline_server/Dockerfile
          push: true
          tags: |
            vicharanashala/faqcluster-pipeline:latest
            vicharanashala/faqcluster-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
