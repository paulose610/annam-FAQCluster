name: Build & Push Pipeline Image

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "pre_pipeline/**"
      - "post_pipeline/**"
      - "run_pipeline.py"
      - "run_full.py"
      - "run_pre_pipeline.py"
      - "run_post_pipeline.py"
      - "_job_ctl.py"
      - "config/**"
      - "pipeline_server.py"
      - "Dockerfile.pipeline"
      - "requirements.txt"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push pipeline image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.pipeline
          push: true
          tags: |
            vicharanashala/faqcluster-pipeline:latest
            vicharanashala/faqcluster-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
