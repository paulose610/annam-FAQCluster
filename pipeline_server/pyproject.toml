[project]
name = "faqcluster-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # API server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",

    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",

    # Machine learning & clustering
    "scikit-learn>=1.3.0",
    "hdbscan>=0.8.33",
    "umap-learn>=0.5.4",

    # NLP / Embeddings
    "sentence-transformers>=2.2.2",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",

    # Fuzzy matching & dedup
    "rapidfuzz>=3.0.0",

    # Config / misc
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "scipy>=1.11.0",

    # HTTP client (used by llm_evaluator_hf)
    "requests>=2.28.0",

    # LLM APIs
    "anthropic>=0.25.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
